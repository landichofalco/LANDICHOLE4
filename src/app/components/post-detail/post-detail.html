<div class="container mt-4" *ngIf="post">
  <h2>{{ post.title }}</h2>
  <p class="text-muted">
    By {{ post.firstName }} {{ post.lastName }} 
    on {{ post.dateCreated | date:'medium' }}
  </p>
  <hr>
  <p>{{ post.body }}</p>
  <a routerLink="/" class="btn btn-secondary mt-3">Back to Posts</a>
</div>
