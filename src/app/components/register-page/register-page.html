<div class="container mt-5" style="max-width: 400px;">
  <h2>Register</h2>
  <form (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" [(ngModel)]="form.username" required #username="ngModel" />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" [(ngModel)]="form.password" required #password="ngModel" />
    </div>

    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" class="form-control" name="firstName" [(ngModel)]="form.firstName" required #firstName="ngModel" />
    </div>

    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" class="form-control" name="lastName" [(ngModel)]="form.lastName" required #lastName="ngModel" />
    </div>

    <button type="submit" class="btn btn-primary w-100">Submit</button>
  </form>
</div>
